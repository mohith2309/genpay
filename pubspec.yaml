name: genpay
description: GenPay - your AI financial wingman that roasts you into saving money.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  flutter_sms_inbox: ^1.0.3
  permission_handler: ^11.1.0
  http: ^1.1.0
  intl: ^0.19.0
  fl_chart: ^0.66.2
  local_auth: ^2.1.7
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.2.2
  uuid: ^4.2.1
  collection: ^1.18.0
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  url_launcher: ^6.2.5
  razorpay_flutter: ^1.3.7
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - .env
